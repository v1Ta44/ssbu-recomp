; 启动器设置 (launcher\launch.ps1 读取; 修改后下次启动生效). 以 ; 开头的是注释.
[run]
; 游戏内名字：在 Console 开始页填写；留空禁止启动，不使用 Windows 用户名。最多 32 字节 UTF-8。
game_name =
; data.arc 所在的文件夹. 留空 = 包内的 romfs 文件夹. 例: romfs = E:\ssbu\romfs
romfs =
; 存档文件夹. 留空 = 包内的 userdata 文件夹
userdata =
; 运行多少秒后自动结束 (0 = 直到关闭窗口)
seconds = 0
; SmokeTest.bat 的运行秒数 (启动检查: 片头动画、标题、演示画面)
smoke_seconds = 90
; 随机数种子: auto = 每次随机选一个并记录下来 (回放时用同一个), none = 不固定, 或填一个数字
fixed_seed = auto
; 1 = 战斗确定性模式 (SSBU_DETERMINISTIC): 战斗开始时固定脚本随机数, 机器慢时不补逻辑帧. 回放更容易一致.
;     0 = 和正常游戏完全相同的行为
deterministic = 1
; 1 = 每个战斗帧记录角色状态和累计散列 (fight_hash.txt), 回放时可以找出第一处不同的帧
fight_hash = 1
; 崩溃或卡死时写 minidump: 1 = 是 (几十 MB), 0 = 否, full = 完整内存 (数 GB)
minidump = 1
; 不让游戏使用的逻辑处理器, 逗号分隔, 例: exclude_cpus = 8,9
exclude_cpus =
; 运行前把存档打包进报告 (回放需要) 的大小上限, MB
save_snapshot_max_mb = 200
; 运行结束后打包报告 zip: always = 每次, error = 只在出错时, never = 不打包 (日志仍在 logs 下)
zip = always
; logs 下保留最近多少次运行的文件夹 (reports 下的 zip 不删)
keep_sessions = 30

[env]
; 个人测试包：切到后台或最小化时继续运行，避免联机停顿。
SSBU_FOCUS_NOTIFY = 0
; 额外传给游戏的环境变量 (BUILDING.md / 运行时源码开头有完整列表), 例:
; SSBU_RENDERER = gl
; SSBU_VK_VALIDATE = 1
; SSBU_VK_CHECKPOINTS = 1
