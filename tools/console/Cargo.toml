[package]
name = "ssbu-console"
version = "0.1.0"
description = "ssbu-recomp console: start the game, graphics and controller settings, room networking, debugging"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "ssbu-console"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
ssbu-updater = { path = "../updater" }
tauri = { version = "=2.12.1", features = ["custom-protocol"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
regex = "=1.13.1"
sha2 = "=0.10.9"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
zip = { version = "=9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
