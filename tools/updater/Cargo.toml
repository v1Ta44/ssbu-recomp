[package]
name = "ssbu-updater"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[features]
default = ["network"]
network = ["dep:reqwest"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
base64 = "=0.22.1"
ring = "=0.17.14"
zip = { version = "=9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
reqwest = { version = "=0.12.28", optional = true, default-features = false, features = ["blocking", "rustls-tls", "json"] }
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
